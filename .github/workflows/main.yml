name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AAFC15: ${{ secrets.AAFC15 }}
          B458C7: ${{ secrets.B458C7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AAFC15', '')
          bm = os.environ.get('B458C7', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 49ed83255ae0c620924a4453284d5ae38a26 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 511cb924b565cab78550e8e1 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
